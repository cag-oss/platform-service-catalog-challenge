<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
  <title id="title">Platform service catalog architecture</title>
  <desc id="desc">Developer traffic flows through API Gateway to Lambda, which stores service data in DynamoDB and emits CloudWatch telemetry with SNS alarms.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#344054" />
    </marker>
    <style>
      .box { rx: 8; ry: 8; stroke-width: 2; }
      .label { font: 600 18px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1d2939; }
      .sub { font: 400 14px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475467; }
      .line { stroke: #344054; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect x="0" y="0" width="1100" height="620" fill="#ffffff" />
  <text x="64" y="60" class="label" style="font-size: 28px;">Platform Service Catalog</text>
  <text x="64" y="88" class="sub">Self-service registration and health reporting for internal development teams</text>

  <rect x="70" y="170" width="170" height="82" class="box" fill="#e8f2ff" stroke="#4b6f9f" />
  <text x="155" y="205" text-anchor="middle" class="label">Developer</text>
  <text x="155" y="228" text-anchor="middle" class="sub">curl / CI / portal</text>

  <rect x="315" y="170" width="190" height="82" class="box" fill="#fff4d6" stroke="#b88a00" />
  <text x="410" y="205" text-anchor="middle" class="label">API Gateway</text>
  <text x="410" y="228" text-anchor="middle" class="sub">HTTP API</text>

  <rect x="585" y="170" width="190" height="82" class="box" fill="#f6e8ff" stroke="#7a4ca0" />
  <text x="680" y="205" text-anchor="middle" class="label">Lambda</text>
  <text x="680" y="228" text-anchor="middle" class="sub">TypeScript API</text>

  <rect x="855" y="170" width="190" height="82" class="box" fill="#e7f7ed" stroke="#39835a" />
  <text x="950" y="205" text-anchor="middle" class="label">DynamoDB</text>
  <text x="950" y="228" text-anchor="middle" class="sub">service records</text>

  <rect x="330" y="365" width="220" height="86" class="box" fill="#f2f4f7" stroke="#667085" />
  <text x="440" y="400" text-anchor="middle" class="label">CloudWatch Logs</text>
  <text x="440" y="423" text-anchor="middle" class="sub">structured JSON + access logs</text>

  <rect x="640" y="365" width="220" height="86" class="box" fill="#f2f4f7" stroke="#667085" />
  <text x="750" y="400" text-anchor="middle" class="label">CloudWatch</text>
  <text x="750" y="423" text-anchor="middle" class="sub">metrics, alarm, dashboard</text>

  <rect x="705" y="500" width="170" height="70" class="box" fill="#ffe8e8" stroke="#b85450" />
  <text x="790" y="540" text-anchor="middle" class="label">SNS Topic</text>

  <path d="M 240 211 L 315 211" class="line" />
  <path d="M 505 211 L 585 211" class="line" />
  <path d="M 775 211 L 855 211" class="line" />
  <path d="M 410 252 L 410 365" class="line" />
  <path d="M 680 252 C 680 300 500 310 455 365" class="line" />
  <path d="M 715 252 L 750 365" class="line" />
  <path d="M 790 451 L 790 500" class="line" />
</svg>
