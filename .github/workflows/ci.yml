name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  format:
    name: Format checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm install --include=optional

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5

      - name: Check formatting
        run: npm run format:check

  app:
    name: App checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm install --include=optional

      - name: Run tests
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Build
        run: npm run build

  terraform:
    name: Terraform checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Build Lambda package
        run: |
          npm ci
          npm run package

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5

      - name: Terraform fmt
        run: terraform fmt -check -recursive infra

      - name: Terraform init
        working-directory: infra/environments/dev
        run: terraform init -backend=false

      - name: Terraform validate
        working-directory: infra/environments/dev
        run: terraform validate

      - name: Terraform DynamoDB module tests
        working-directory: infra/modules/dynamodb
        run: |
          terraform init -backend=false
          terraform test

      - name: Terraform API module tests
        working-directory: infra/modules/platform-api
        run: |
          terraform init -backend=false
          terraform test
